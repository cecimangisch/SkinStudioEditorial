function stripMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/\*(.*?)\*/g, '$1')
    .replace(/#{1,6}\s+/g, '')
    .replace(/^---+$/gm, '')
    .replace(/`(.*?)`/g, '$1')
    .trim();
}

function getWeek(post) {
  const d = new Date(post.dateSort.replace(/[ab]$/, ''));
  // group by week containing the date
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const weekNum = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  // Return human-readable range
  const monday = new Date(d);
  monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate() + 6);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const start = `${months[monday.getMonth()]} ${monday.getDate()}`;
  const end = `${months[sunday.getMonth()]} ${sunday.getDate()}`;
  return `Week of ${start} – ${end}`;
}

function platformIcon(platform) {
  return platform === 'IG' ? '📷' : '▶';
}

function platformClass(platform) {
  return platform === 'IG' ? 'platform-ig' : 'platform-tiktok';
}

function buildSlideText(slide) {
  let parts = [];
  if (slide.label) parts.push(slide.label);
  if (slide.headline) parts.push(stripMarkdown(slide.headline));
  if (slide.body) parts.push(stripMarkdown(slide.body));
  return parts.join('\n\n');
}

function buildFullText(post) {
  let parts = [];
  parts.push(post.title);
  parts.push('');
  post.slides.forEach((slide, i) => {
    parts.push(`--- Slide ${i + 1} ---`);
    parts.push(buildSlideText(slide));
  });
  if (post.caption_ig) {
    parts.push('');
    parts.push('--- Instagram Caption ---');
    parts.push(stripMarkdown(post.caption_ig));
  }
  if (post.caption_tiktok) {
    parts.push('');
    parts.push('--- TikTok Caption ---');
    parts.push(stripMarkdown(post.caption_tiktok));
  }
  return parts.join('\n');
}

// ─── COPY TO CLIPBOARD ───────────────────────────────────────────────────────

function copyToClipboard(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove('copied');
    }, 2000);
  });
}

// ─── STATE ───────────────────────────────────────────────────────────────────

let activePostId = null;

// ─── SIDEBAR BUILD ───────────────────────────────────────────────────────────

function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = '';

  // Group by week
  const weeks = {};
  POSTS.forEach(post => {
    const wk = getWeek(post);
    if (!weeks[wk]) weeks[wk] = [];
    weeks[wk].push(post);
  });

  Object.keys(weeks).forEach(weekLabel => {
    const group = document.createElement('div');
    group.className = 'week-group';

    const label = document.createElement('div');
    label.className = 'week-label';
    label.textContent = weekLabel;
    group.appendChild(label);

    weeks[weekLabel].forEach(post => {
      const item = document.createElement('div');
      item.className = 'post-item' + (post.published ? ' published' : '');
      item.setAttribute('data-id', post.id);
      item.setAttribute('tabindex', '0');
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `${post.date} ${post.platform} — ${post.title}`);

      item.innerHTML = `
        <div class="platform-badge">${platformIcon(post.platform)}</div>
        <div class="post-meta">
          <div class="post-date">${post.date} · ${post.platform}${post.published ? ' · Published' : ''}</div>
          <div class="post-title">${post.title}</div>
        </div>
      `;

      item.addEventListener('click', () => selectPost(post.id));
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectPost(post.id); }
      });

      group.appendChild(item);
    });

    sidebar.appendChild(group);
  });
}

// ─── POST VIEW BUILD ─────────────────────────────────────────────────────────

function selectPost(id) {
  activePostId = id;
  const post = POSTS.find(p => p.id === id);
  if (!post) return;

  // Update sidebar active state
  document.querySelectorAll('.post-item').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-id') === id);
  });

  // Close sidebar on mobile
  if (window.innerWidth <= 768) {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  }

  // Build post view
  const welcome = document.getElementById('welcome');
  const postView = document.getElementById('post-view');
  welcome.style.display = 'none';
  postView.style.display = 'block';

  const slideCount = post.slides.length;
  const captionCount = (post.caption_ig ? 1 : 0) + (post.caption_tiktok ? 1 : 0);

  let html = `
    <div class="post-header">
      <div class="post-header-left">
        <div class="post-heading-meta">
          <span class="meta-chip ${platformClass(post.platform)}">${platformIcon(post.platform)} ${post.platform}</span>
          <span class="meta-chip">${post.column}</span>
          ${post.published ? '<span class="meta-chip published">Published</span>' : ''}
        </div>
        <div class="post-main-title">${post.title}</div>
        <div class="post-slide-count">${slideCount} slides · ${post.date}, 2026</div>
      </div>
      <button class="copy-all-btn" onclick="copyAll(this, '${id}')">Copy Everything</button>
    </div>
  `;

  // Slides
  html += `<div class="section-label">Slides</div>`;

  post.slides.forEach((slide, i) => {
    const slideText = buildSlideText(slide);
    const labelHtml = slide.label ? `<span class="slide-label-tag">${slide.label}</span>` : '';
    const headlineHtml = slide.headline
      ? `<div class="slide-headline">${slide.headline.replace(/\n/g, '<br>')}</div>`
      : '';
    const bodyHtml = slide.body
      ? `<div class="slide-body">${slide.body.split('\n').map(l => l ? `<p>${l}</p>` : '').join('')}</div>`
      : '';

    html += `
      <div class="slide-card">
        <div class="slide-card-header">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <span class="slide-number">Slide ${i + 1}</span>
            ${labelHtml}
          </div>
          <button class="copy-btn" onclick="copySlide(this, ${i}, '${id}')">Copy</button>
        </div>
        ${headlineHtml}
        ${bodyHtml}
      </div>
    `;
  });

  // Captions
  if (post.caption_ig || post.caption_tiktok) {
    html += `<div class="section-label">Caption</div>`;
  }

  if (post.caption_ig) {
    html += `
      <div class="caption-card">
        <div class="caption-card-header">
          <span class="caption-platform-label">📷 Instagram Caption</span>
          <button class="copy-btn" onclick="copyCaption(this, 'ig', '${id}')">Copy</button>
        </div>
        <div class="caption-text">${escapeHtml(post.caption_ig)}</div>
      </div>
    `;
  }

  if (post.caption_tiktok) {
    html += `
      <div class="caption-card">
        <div class="caption-card-header">
          <span class="caption-platform-label">▶ TikTok Caption</span>
          <button class="copy-btn" onclick="copyCaption(this, 'tiktok', '${id}')">Copy</button>
        </div>
        <div class="caption-text">${escapeHtml(post.caption_tiktok)}</div>
      </div>
    `;
  }

  postView.innerHTML = html;

  // Scroll to top
  document.getElementById('main').scrollTop = 0;
  window.scrollTo(0, 0);
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ─── COPY ACTIONS ────────────────────────────────────────────────────────────

function copySlide(btn, slideIndex, postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const text = buildSlideText(post.slides[slideIndex]);
  copyToClipboard(text, btn);
}

function copyCaption(btn, type, postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  const text = type === 'ig' ? post.caption_ig : post.caption_tiktok;
  copyToClipboard(stripMarkdown(text || ''), btn);
}

function copyAll(btn, postId) {
  const post = POSTS.find(p => p.id === postId);
  if (!post) return;
  copyToClipboard(buildFullText(post), btn);
}

// ─── MOBILE ──────────────────────────────────────────────────────────────────

function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}
